name: CI

# 触发条件：推送到主分支、以及对任何分支的 PR。
# 目的很单一——在合并前把「类型挂了 / 约定被破坏 / 测试红了」这三件事拦住。
on:
  push:
    branches: [main, master]
  pull_request:

# 同一分支的旧流水线在新提交到达时自动取消，避免排队堆积。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: 类型检查 · 代码规范 · 测试
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # electron 体积大且与本次校验无关，跳过其二进制下载可省下数分钟
      - name: 安装依赖
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: 类型检查（tsc --noEmit）
        run: npm run typecheck

      - name: 代码规范（eslint）
        run: npm run lint

      - name: 格式检查（prettier）
        run: npm run format:check

      - name: 单元测试
        run: npm test

      - name: 构建产物
        run: npx vite build
